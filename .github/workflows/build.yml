name: build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact: windows
          - os: macos-latest
            target: --mac
            artifact: macos
          - os: ubuntu-latest
            target: --linux
            artifact: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build renderer/main/preload
        run: pnpm build

      - name: Package (${{ matrix.artifact }})
        run: npx electron-builder ${{ matrix.target }} --publish always
        env:
          # GitHub Releases 发布令牌（electron-builder 约定）
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Windows 代码签名（Authenticode）—— 未配置则跳过签名
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # macOS Developer ID 签名 + 公证 —— 未配置则跳过
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAC_CERT_IDENTITY: ${{ secrets.MAC_CERT_IDENTITY }}
          # macOS 证书（base64 的 .p12）
          CSC_LINK_MAC: ${{ secrets.MAC_CSC_LINK }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: piforge-${{ matrix.artifact }}
          path: |
            release/**/*.exe
            release/**/*.dmg
            release/**/*.AppImage
            release/**/*.deb
            release/**/*.yml
            release/**/*.blockmap
          if-no-files-found: ignore
